<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 01 - Juan Loaiza</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .contenedor {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .contenedor img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .texto-overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 20px;
      font-family: sans-serif;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <img src="assets/img/spongebob.jpg" alt="Imagen de fondo">
    <div class="texto-overlay">
      Juan Loaiza — B74200
    </div>
  </div>
</body>
</html>
